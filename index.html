<!DOCTYPE html>
<html lang="sv">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    Försäljning
  </title>

  <link
    rel="stylesheet"
    href="styles.css">

</head>

<body>

<header>

  <img
    src="images/hsk-logo.png"
    alt="Härnösands SK"
    class="club-logo">

  <h1>
    HSK Pappersförsäljning 2026
  </h1>

  <p>
    Live-resultat för hela föreningen
  </p>

</header>

<div class="container">

  <!-- ===================================== -->
  <!-- KPI -->
  <!-- ===================================== -->

  <section class="summary-grid">

    <div class="summary-card">

      <h2>
        Totalt sålt
      </h2>

      <p id="total">
        0
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Omsättning
      </h2>

      <p id="revenue">
        0 kr
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Vinst till föreningen
      </h2>

      <p id="profit">
        0 kr
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Antal lag
      </h2>

      <p id="teamCount">
        0
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Antal spelare
      </h2>

      <p id="playerCount">
        0
      </p>

    </div>

  </section>

  <!-- ===================================== -->
  <!-- FÖRENINGENS MÅLPROGRESS -->
  <!-- ===================================== -->

  <section class="club-progress-section">

    <div class="club-progress-card">

      <h2>
        HSK:s försäljningsmål 2026
      </h2>

      <div class="club-progress-label">

        <span id="goal">
          0 / 0
        </span>

        <span id="goalPercent">
          0%
        </span>

      </div>

      <div class="progress-bar large">

        <div
          id="clubProgressFill"
          class="progress-fill">
        </div>

      </div>

    </div>

  </section>

  <!-- ===================================== -->
  <!-- FILTER -->
  <!-- ===================================== -->

  <section class="filters">

    <label for="teamFilter">

      Filtrera lag:

    </label>

    <select id="teamFilter">

      <option value="Alla">

        Alla

      </option>

    </select>

  </section>

  <div class="chart-card">

    <h2>
      Fördelning av försäljning
    </h2>
  
    <div id="productDistribution"></div>
  
  </div>

  <!-- ===================================== -->
  <!-- TOPPLISTA -->
  <!-- ===================================== -->

  <section>

    <h2
      id="toplistTitle"
      class="section-title">
    
      Topplista
    
    </h2>

    <div
      id="toplist"
      class="toplist-grid">
    </div>

  </section>

  <!-- ===================================== -->
  <!-- PER LAG -->
  <!-- ===================================== -->

  <section>

    <h2 class="section-title">

      Per lag

    </h2>

    <div
      id="teams"
      class="team-grid">
    </div>

  </section>

</div>

<footer class="footer">

  Developed by Beaver Data Solutions AB

</footer>

  
<script
  type="module"
  src="app.js">
</script>


</body>
</html>
