<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Försäljning</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Försäljning toalett / hushållspapper</h1>
  <p>Live-resultat för hela föreningen</p>
</header>

<div class="container">

  <section class="summary-grid">

    <div class="summary-card">
      <h2>Totalt sålt</h2>
      <p id="total">0</p>
    </div>

    <div class="summary-card">
      <h2>Antal lag</h2>
      <p id="teamCount">0</p>
    </div>

    <div class="summary-card">
      <h2>Antal spelare</h2>
      <p id="playerCount">0</p>
    </div>

  </section>

  <section class="filters">

    <label for="teamFilter">Filtrera lag:</label>

    <select id="teamFilter">
      <option value="Alla">Alla</option>
    </select>

  </section>

  <section>

    <h2 class="section-title">Topplista</h2>

    <div id="toplist" class="toplist-grid"></div>

  </section>

  <section>

    <h2 class="section-title">Per lag</h2>

    <div id="teams" class="team-grid"></div>

  </section>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
