<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Försäljning</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Försäljning toalett / hushållspapper</h1>
</header>

<section class="summary">
  <div class="card">
    <h2>Totalt sålt</h2>
    <p id="total">0</p>
  </div>
</section>

<section class="filters">
  <label for="teamFilter">Filtrera lag:</label>
  <select id="teamFilter">
    <option value="Alla">Alla</option>
  </select>
</section>

<section>
  <h2>Topplista</h2>
  <div id="toplist" class="grid"></div>
</section>

<section>
  <h2>Per lag</h2>
  <div id="teams"></div>
</section>

<script type="module">
import { fetchSalesData } from './data.js';

let rawData = [];

async function init() {
  rawData = await fetchSalesData();
  populateFilter(rawData);
  render(rawData);
}

function populateFilter(data) {
  const teams = [...new Set(data.map(r => r.lag))].sort();
  const select = document.getElementById("teamFilter");

  teams.forEach(team => {
    const option = document.createElement("option");
    option.value = team;
    option.textContent = team;
    select.appendChild(option);
  });

  select.addEventListener("change", () => {
    const selected = select.value;
    const filtered = selected === "Alla"
      ? rawData
      : rawData.filter(r => r.lag === selected);

    render(filtered);
  });
}

function render(data) {

  let total = 0;
  const players = {};
  const teams = {};

  data.forEach(r => {
    total += r.total;

    // spelare
    if (!players[r.spelare]) {
      players[r.spelare] = { lag: r.lag, total: 0 };
    }
    players[r.spelare].total += r.total;

    // lag
    if (!teams[r.lag]) {
      teams[r.lag] = {};
    }

    if (!teams[r.lag][r.spelare]) {
      teams[r.lag][r.spelare] = 0;
    }

    teams[r.lag][r.spelare] += r.total;
  });

  // total
  document.getElementById("total").innerText = total;

  // toplista
  const sortedPlayers = Object.entries(players)
    .sort((a,b) => b[1].total - a[1].total);

  document.getElementById("toplist").innerHTML = sortedPlayers
    .slice(0,10)
    .map(([name, obj]) => `
      <div class="card">
        <h3>${name}</h3>
        <p>${obj.lag}</p>
        <strong>${obj.total}</strong>
      </div>
    `).join("");

  // per lag
  const teamContainer = document.getElementById("teams");

  teamContainer.innerHTML = Object.entries(teams).map(([team, players]) => {

    const sorted = Object.entries(players)
      .sort((a,b) => b[1] - a[1]);

    return `
      <div class="team">
        <h3>${team}</h3>
        ${sorted.map(([name, total]) => `
          <div class="row">
            <span>${name}</span>
            <span>${total}</span>
          </div>
        `).join("")}
      </div>
    `;
  }).join("");

}

init(); 
</script>

</body>
</html>
