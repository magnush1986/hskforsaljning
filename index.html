<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Försäljning</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>

  <h1>
    Försäljning toalett / hushållspapper
  </h1>

  <p>
    Live-resultat för hela föreningen
  </p>

</header>

<div class="container">

  <!-- ===================================== -->
  <!-- KPI -->
  <!-- ===================================== -->

  <section class="summary-grid">

    <div class="summary-card">

      <h2>
        Totalt sålt
      </h2>

      <p id="total">
        0
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Omsättning
      </h2>

      <p id="revenue">
        0 kr
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Vinst till föreningen
      </h2>

      <p id="profit">
        0 kr
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Målprogress
      </h2>

      <p id="goal">
        0 / 0
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Antal lag
      </h2>

      <p id="teamCount">
        0
      </p>

    </div>

    <div class="summary-card">

      <h2>
        Antal spelare
      </h2>

      <p id="playerCount">
        0
      </p>

    </div>

  </section>

  <!-- ===================================== -->
  <!-- FILTER -->
  <!-- ===================================== -->

  <section class="filters">

    <label for="teamFilter">
      Filtrera lag:
    </label>

    <select id="teamFilter">

      <option value="Alla">
        Alla
      </option>

    </select>

  </section>

  <!-- ===================================== -->
  <!-- TOPPLISTA -->
  <!-- ===================================== -->

  <section>

    <h2 class="section-title">
      Topplista
    </h2>

    <div
      id="toplist"
      class="toplist-grid">
    </div>

  </section>

  <!-- ===================================== -->
  <!-- LAG -->
  <!-- ===================================== -->

  <section>

    <h2 class="section-title">
      Per lag
    </h2>

    <div
      id="teams"
      class="team-grid">
    </div>

  </section>

</div>

<script
  type="module"
  src="app.js">
</script>

<footer class="footer">

  Developed by Beaver Data Solutions AB

</footer>  
</body>
</html>
